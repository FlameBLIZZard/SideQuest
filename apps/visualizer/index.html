<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse · Sidequest</title>
<link rel="stylesheet" href="../../shared/sq.css">
<style>
  :root { --accent: #c084fc; --accent-ink: #160624; }
  .sq-stage { background: #000; }
  @media (min-width: 821px) { .sq-stage { position: sticky; top: 69px; height: calc(100vh - 84px); } }
  #cv { max-width: calc(100% - 24px); max-height: calc(100% - 24px); background: #000; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .player { display: grid; gap: 8px; }
  .seek { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--mute); }
  .drop-hint { position: absolute; inset: 0; display: none; place-items: center; background: #c084fc33; font-size: 20px; font-weight: 800; color: #fff; border: 3px dashed var(--accent); border-radius: var(--radius); }
  .sq-stage.dragover .drop-hint { display: grid; }
  .rec { display: inline-flex; gap: 8px; align-items: center; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 34px; height: 24px; padding: 0; border-radius: 6px; }
</style>
</head>
<body>
<header class="sq-top">
  <a class="home" href="../../index.html">← Sidequest</a>
  <h1><span class="dot"></span>Pulse</h1>
  <span class="mute">music visualizer</span>
  <div class="spacer"></div>
  <div class="actions">
    <button id="openAudio">Open song</button>
    <button id="micBtn">Use mic</button>
    <button id="full">Fullscreen</button>
    <button id="rec" class="primary"><span class="rec">Record video</span></button>
  </div>
</header>
<input type="file" id="fileIn" accept="audio/*,video/*" hidden>
<main class="sq-app">
  <aside class="sq-side">
    <section class="panel player">
      <h2>Now playing</h2>
      <div id="title" style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">No song loaded</div>
      <div class="row"><button id="play" class="primary" disabled>▶ Play</button><button id="demo" data-smoke>Demo beat</button></div>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </section>
    <section class="panel">
      <h2>Visual</h2>
      <div class="modes" id="modes"></div>
    </section>
    <section class="panel stack">
      <h2>Look</h2>
      <div class="swatches" id="themes"></div>
      <label class="field"><span>Sensitivity <b id="sensL"></b></span><input type="range" id="sens" min="30" max="250"></label>
      <label class="field"><span>Trails <b id="trailL"></b></span><input type="range" id="trail" min="0" max="95"></label>
      <label class="check"><input type="checkbox" id="showTitle"> Show song title</label>
      <label class="field"><span>Video size</span>
        <select id="size"><option value="1280x720">720p landscape</option><option value="1920x1080">1080p landscape</option><option value="1080x1920">1080×1920 vertical (reels)</option><option value="1080x1080">1080 square</option></select>
      </label>
    </section>
  </aside>
  <div class="sq-stage" id="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div class="drop-hint">Drop a song</div>
  </div>
</main>
<audio id="audio" crossorigin="anonymous"></audio>

<script src="../../shared/sq.js"></script>
<script>
const { $, el } = SQ;
const THEMES = [
  ['Neon', ['#c084fc', '#22d3ee', '#f472b6']], ['Sunset', ['#fb923c', '#f43f5e', '#facc15']],
  ['Ocean', ['#38bdf8', '#2dd4bf', '#818cf8']], ['Toxic', ['#a3e635', '#22c55e', '#fde047']],
  ['Mono', ['#ffffff', '#a1a1aa', '#52525b']], ['Fire', ['#ef4444', '#f97316', '#fde68a']],
];
const MODES = { bars: 'Bars', circle: 'Radial', wave: 'Waveform', particles: 'Particles', tunnel: 'Tunnel', mountains: 'Mountains' };
const S = Object.assign({ mode: 'circle', theme: 0, sens: 120, trail: 40, showTitle: true, size: '1280x720' }, SQ.store.get('pulse', {}));
const cv = $('#cv'), c = cv.getContext('2d'), audio = $('#audio');
let ac, analyser, srcNode, micStream, micNode, recDest, demoNodes = null, songName = '';
let freq = new Uint8Array(1024), wave = new Uint8Array(2048);

function ensureAudio() {
  if (ac) return;
  ac = new AudioContext();
  analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .8;
  recDest = ac.createMediaStreamDestination();
  srcNode = ac.createMediaElementSource(audio);
  srcNode.connect(analyser); srcNode.connect(ac.destination); srcNode.connect(recDest);
}
function stopDemo() { if (demoNodes) { clearInterval(demoNodes.timer); demoNodes.out.disconnect(); demoNodes = null; } }
function stopMic() { if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micNode.disconnect(); micStream = null; } }

async function loadFile(f) {
  ensureAudio(); stopDemo(); stopMic();
  audio.src = URL.createObjectURL(f); songName = f.name.replace(/\.[^.]+$/, '');
  $('#title').textContent = songName; $('#play').disabled = false;
  await ac.resume(); audio.play();
}
$('#openAudio').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = (e) => e.target.files[0] && loadFile(e.target.files[0]);
const stage = $('#stage');
stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('dragover'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dragover'));
stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
$('#play').onclick = async () => { ensureAudio(); await ac.resume(); audio.paused ? audio.play() : audio.pause(); };
audio.onplay = () => ($('#play').textContent = '❚❚ Pause');
audio.onpause = () => ($('#play').textContent = '▶ Play');
audio.ontimeupdate = () => {
  $('#cur').textContent = SQ.fmtTime(audio.currentTime); $('#dur').textContent = SQ.fmtTime(audio.duration || 0);
  if (!seeking && audio.duration) $('#seek').value = audio.currentTime / audio.duration * 1000;
};
let seeking = false;
$('#seek').oninput = () => { seeking = true; };
$('#seek').onchange = (e) => { seeking = false; if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
audio.onended = () => { if (recorder && recorder.recording) $('#rec').click(); };

$('#micBtn').onclick = async () => {
  ensureAudio(); stopDemo(); audio.pause();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micNode = ac.createMediaStreamSource(micStream); micNode.connect(analyser); micNode.connect(recDest);
    await ac.resume(); songName = 'Live mic'; $('#title').textContent = songName;
  } catch { SQ.toast('Microphone blocked'); }
};
// A built-in synth loop so you can see something without a file.
$('#demo').onclick = async () => {
  ensureAudio(); stopMic(); audio.pause(); stopDemo(); await ac.resume();
  const out = ac.createGain(); out.gain.value = .5; out.connect(analyser); out.connect(ac.destination); out.connect(recDest);
  let step = 0; const bpm = 120, sd = 60 / bpm / 4, notes = [45, 45, 48, 43];
  const timer = setInterval(() => {
    const t = ac.currentTime + .05;
    if (step % 4 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .2); g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(out); o.start(t); o.stop(t + .4); }
    if (step % 2 === 1) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 8000 + Math.random() * 2000; g.gain.setValueAtTime(.03, t); g.gain.exponentialRampToValueAtTime(.0001, t + .04); o.connect(g).connect(out); o.start(t); o.stop(t + .05); }
    const n = notes[Math.floor(step / 16) % 4];
    if (step % 2 === 0) { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = 440 * Math.pow(2, (n + (step % 8 === 6 ? 12 : 0) - 69) / 12); f.type = 'lowpass'; f.frequency.value = 600 + (step % 16) * 120; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + sd * 1.8); o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + sd * 2); }
    step++;
  }, sd * 1000);
  demoNodes = { out, timer }; songName = 'Demo beat'; $('#title').textContent = songName;
};

// ---------- visuals ----------
let particles = [], hue = 0, tunnel = [];
function band(lo, hi) { let s = 0; for (let i = lo; i < hi; i++) s += freq[i]; return s / (hi - lo) / 255; }
function render() {
  requestAnimationFrame(render);
  const W = cv.width, H = cv.height, P = THEMES[S.theme][1], k = S.sens / 100;
  if (analyser) { analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); }
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = `rgba(0,0,0,${1 - S.trail / 100})`; c.fillRect(0, 0, W, H);
  const bass = Math.min(1, band(1, 12) * k), mid = Math.min(1, band(12, 120) * k), high = Math.min(1, band(120, 500) * k * 1.6);
  const grad = c.createLinearGradient(0, H, W, 0); P.forEach((col, i) => grad.addColorStop(i / (P.length - 1), col));
  const m = Math.min(W, H);
  c.lineCap = 'round';
  if (S.mode === 'bars') {
    const n = 64, bw = W / n;
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.pow(i / n, 1.7) * 600) + 1, v = Math.min(1, freq[idx] / 255 * k);
      const h = v * H * .42; c.fillStyle = grad;
      c.fillRect(i * bw + bw * .15, H / 2 - h, bw * .7, h * 2);
    }
  } else if (S.mode === 'circle') {
    const R = m * (.18 + bass * .08), n = 180;
    c.save(); c.translate(W / 2, H / 2);
    c.strokeStyle = grad; c.lineWidth = Math.max(2, m / 260);
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.pow((i < n / 2 ? i : n - i) / (n / 2), 1.4) * 220) + 2, v = Math.min(1, freq[idx] / 255 * k * (1 + i % (n / 2) / n)), a = i / n * Math.PI * 2 + Math.PI / 2;
      c.strokeStyle = P[i % P.length];
      c.beginPath(); c.moveTo(Math.cos(a) * R, Math.sin(a) * R); c.lineTo(Math.cos(a) * (R + v * m * .3), Math.sin(a) * (R + v * m * .3)); c.stroke();
    }
    c.restore();
    c.fillStyle = P[0]; c.globalAlpha = .15 + bass * .5; c.beginPath(); c.arc(W / 2, H / 2, R * .9, 0, 7); c.fill(); c.globalAlpha = 1;
  } else if (S.mode === 'wave') {
    for (let layer = 0; layer < 3; layer++) {
      c.strokeStyle = P[layer]; c.lineWidth = Math.max(2, m / 200) * (3 - layer) * .7; c.beginPath();
      for (let i = 0; i < wave.length; i += 4) {
        const x = i / wave.length * W, y = H / 2 + ((wave[i] - 128) / 128) * H * .4 * k * (1 - layer * .25) * (layer % 2 ? -1 : 1);
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    }
  } else if (S.mode === 'particles') {
    const spawn = Math.floor(bass * 14 + mid * 6);
    for (let i = 0; i < spawn; i++) { const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 6) * (1 + bass * 2) * m / 720; particles.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: SQ.pick(P), r: (1 + Math.random() * 3) * m / 720 }); }
    c.globalCompositeOperation = 'lighter';
    particles = particles.filter((p) => (p.life -= .012) > 0);
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 1.01; p.vy *= 1.01; c.globalAlpha = p.life; c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, p.r * (1 + high * 2), 0, 7); c.fill(); }
    c.globalAlpha = 1;
    c.fillStyle = P[0]; c.beginPath(); c.arc(W / 2, H / 2, m * (.04 + bass * .1), 0, 7); c.fill();
  } else if (S.mode === 'tunnel') {
    if (Math.random() < .3 + bass) tunnel.push({ z: 1, col: SQ.pick(P), rot: hue / 50, sides: 6 });
    tunnel = tunnel.filter((t) => (t.z *= .965 - bass * .02) > .02);
    c.lineWidth = Math.max(2, m / 300);
    for (const t of tunnel) {
      const r = m * .8 * (1 - t.z) ** 2 * (1 + mid * .2);
      c.strokeStyle = t.col; c.globalAlpha = Math.min(1, (1 - t.z) * 2); c.beginPath();
      for (let s = 0; s <= t.sides; s++) { const a = s / t.sides * Math.PI * 2 + t.rot; const x = W / 2 + Math.cos(a) * r, y = H / 2 + Math.sin(a) * r; s ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.stroke();
    }
    c.globalAlpha = 1;
  } else if (S.mode === 'mountains') {
    for (let layer = 3; layer >= 0; layer--) {
      c.fillStyle = P[layer % P.length]; c.globalAlpha = .35 + (3 - layer) * .2; c.beginPath(); c.moveTo(0, H);
      const pts = 80;
      for (let i = 0; i <= pts; i++) { const idx = Math.floor(i / pts * 200 * (layer + 1)) + 2, v = Math.min(1, freq[idx] / 255 * k); c.lineTo(i / pts * W, H - (v * H * .5 + layer * H * .05) - H * .08); }
      c.lineTo(W, H); c.fill();
    }
    c.globalAlpha = 1;
  }
  hue++;
  if (S.showTitle && songName) {
    c.fillStyle = '#fff'; c.globalAlpha = .9; c.font = `700 ${m * .045}px system-ui, sans-serif`; c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText(songName, m * .05, H - m * .05); c.globalAlpha = 1;
  }
}
requestAnimationFrame(render);

// ---------- UI ----------
function ui() {
  $('#modes').innerHTML = '';
  for (const [k, v] of Object.entries(MODES)) $('#modes').append(el('button', { class: S.mode === k ? 'on' : '', onclick: () => { S.mode = k; particles = []; tunnel = []; ui(); } }, v));
  $('#themes').innerHTML = '';
  THEMES.forEach(([n, p], i) => $('#themes').append(el('button', { title: n, class: S.theme === i ? 'on' : '', style: { background: `linear-gradient(90deg, ${p.join(',')})`, outline: S.theme === i ? '2px solid var(--ink)' : '' }, onclick: () => { S.theme = i; ui(); } })));
  $('#sens').value = S.sens; $('#sensL').textContent = S.sens + '%';
  $('#trail').value = S.trail; $('#trailL').textContent = S.trail + '%';
  $('#showTitle').checked = S.showTitle; $('#size').value = S.size;
  const [w, h] = S.size.split('x').map(Number); if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  SQ.store.set('pulse', S);
}
$('#sens').oninput = (e) => { S.sens = +e.target.value; ui(); };
$('#trail').oninput = (e) => { S.trail = +e.target.value; ui(); };
$('#showTitle').onchange = (e) => { S.showTitle = e.target.checked; ui(); };
$('#size').onchange = (e) => { S.size = e.target.value; ui(); };
$('#full').onclick = () => cv.requestFullscreen && cv.requestFullscreen();

let recorder = null;
$('#rec').onclick = async () => {
  if (recorder && recorder.recording) {
    const blob = await recorder.stop();
    SQ.download(blob, `pulse-${(songName || 'visual').replace(/[^\w-]+/g, '_')}.${recorder.ext}`);
    $('#rec').innerHTML = '<span class="rec">Record video</span>'; return;
  }
  ensureAudio(); await ac.resume();
  if (!audio.src && !demoNodes && !micStream) return SQ.toast('Open a song (or the demo beat) first');
  if (audio.src && !demoNodes && !micStream) { audio.currentTime = 0; audio.play(); }
  recorder = SQ.recorder(cv, { fps: 30, audio: recDest.stream }); recorder.start();
  $('#rec').innerHTML = '<span class="rec"><span class="rec-dot"></span>Stop</span>';
  SQ.toast(audio.src ? 'Recording from the start; stops when the song ends' : 'Recording…');
};
ui();
</script>
</body>
</html>
