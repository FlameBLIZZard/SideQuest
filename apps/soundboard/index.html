<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boop · Sidequest</title>
<link rel="stylesheet" href="../../shared/sq.css">
<style>
  :root { --accent: #fb7185; --accent-ink: #22050b; }
  .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: min(760px, 100%); }
  .pad {
    aspect-ratio: 1.15; border-radius: 16px; border: 0; padding: 12px; position: relative;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left;
    background: color-mix(in srgb, var(--c) 22%, var(--panel-2)); color: var(--ink);
    box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--c) 45%, transparent); white-space: normal;
  }
  .pad:hover { background: color-mix(in srgb, var(--c) 32%, var(--panel-2)); }
  .pad.playing { background: var(--c); color: #111; transform: scale(.97); }
  .pad.empty { background: transparent; border: 2px dashed var(--line); box-shadow: none; color: var(--mute); }
  .pad.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
  .pad b { font-size: 15px; line-height: 1.15; }
  .pad kbd { font-size: 12px; }
  .pad .meta { display: flex; gap: 6px; font-size: 11px; opacity: .8; }
  .pad .prog { position: absolute; left: 0; bottom: 0; height: 4px; background: #0008; border-radius: 0 0 16px 16px; }
  .stage-in { display: grid; gap: 14px; place-items: center; padding: 20px; width: 100%; }
  .rec { display: inline-flex; align-items: center; gap: 8px; }
  .colors { display: flex; gap: 6px; flex-wrap: wrap; }
  .colors button { width: 26px; height: 26px; border-radius: 50%; padding: 0; }
  @media (max-width: 600px) { .pads { gap: 8px; } .pad b { font-size: 12px; } }
</style>
</head>
<body>
<header class="sq-top">
  <a class="home" href="../../index.html">← Sidequest</a>
  <h1><span class="dot"></span>Boop</h1>
  <span class="mute">soundboard</span>
  <div class="spacer"></div>
  <div class="actions">
    <button id="edit" data-smoke>Edit pads</button>
    <button id="stopAll" title="Esc">Stop all</button>
  </div>
</header>
<input type="file" id="fileIn" accept="audio/*,video/*" hidden>
<main class="sq-app">
  <aside class="sq-side">
    <section class="panel stack">
      <h2>Board</h2>
      <label class="field"><span>Master volume <b id="masterL"></b></span><input type="range" id="master" min="0" max="100"></label>
      <label class="check"><input type="checkbox" id="overlap"> Let sounds overlap</label>
      <p class="mute" style="margin:0;font-size:12px">Press the key on a pad to fire it. Drop audio files onto pads to load them.</p>
    </section>
    <section class="panel stack" id="editor" hidden>
      <h2>Pad <span id="padNo"></span></h2>
      <input type="text" id="name" placeholder="Pad name">
      <div class="colors" id="colors"></div>
      <div class="row">
        <button id="load">Load file</button>
        <button id="recBtn"><span class="rec">● Record mic</span></button>
      </div>
      <label class="field"><span>Volume <b id="volL"></b></span><input type="range" id="vol" min="0" max="150"></label>
      <label class="check"><input type="checkbox" id="loop"> Loop (press again to stop)</label>
      <div class="row">
        <button id="saveClip">Download clip</button>
        <button id="clearPad">Clear pad</button>
      </div>
    </section>
  </aside>
  <div class="sq-stage"><div class="stage-in"><div class="pads" id="pads"></div><div class="mute">Tip: <kbd>Esc</kbd> stops everything.</div></div></div>
</main>

<script src="../../shared/sq.js"></script>
<script>
const { $, el } = SQ;
const KEYS = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', 'z', 'x', 'c', 'v'];
const COLORS = ['#fb7185', '#f97316', '#facc15', '#a3e635', '#34d399', '#22d3ee', '#818cf8', '#c084fc', '#f472b6', '#94a3b8'];
const BUILTINS = ['Airhorn', 'Ba dum tss', 'Sad trombone', 'Boing', 'Laser', 'Drumroll', 'Coin', 'Applause', 'Explosion', 'Crickets'];
const db = SQ.idb('boop');
const defaults = () => KEYS.map((_, i) => i < BUILTINS.length ? { name: BUILTINS[i], color: COLORS[i % COLORS.length], vol: 100, loop: false, kind: 'builtin', builtin: BUILTINS[i] } : { name: '', color: COLORS[i % COLORS.length], vol: 100, loop: false, kind: null });
let pads = SQ.store.get('boop-pads', null) || defaults();
const cfg = Object.assign({ master: 80, overlap: true }, SQ.store.get('boop', {}));
let editing = false, sel = 0;
let ac, masterGain;
const buffers = {}; // pad index -> AudioBuffer
const playingSrc = {}; // pad index -> [{src, start, dur}]

function ensureAudio() { if (ac) return ac.resume(); ac = new AudioContext(); masterGain = ac.createGain(); masterGain.gain.value = cfg.master / 100; masterGain.connect(ac.destination); }
function savePads() { SQ.store.set('boop-pads', pads); }

// ---------- built-in sounds, synthesized offline ----------
async function synth(name) {
  const rate = 44100, len = { Airhorn: 1.4, 'Ba dum tss': 1.6, 'Sad trombone': 3, Boing: 1, Laser: .5, Drumroll: 2.8, Coin: .6, Applause: 3.5, Explosion: 2.5, Crickets: 2.5 }[name];
  const c = new OfflineAudioContext(1, rate * len, rate), out = c.createGain(); out.connect(c.destination);
  const noise = c.createBuffer(1, rate * len, rate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const osc = (type, f, t0, t1, g0 = .3, dest = out) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(g0, t0); g.gain.setValueAtTime(g0, t1 - .03); g.gain.linearRampToValueAtTime(0, t1); o.connect(g).connect(dest); o.start(t0); o.stop(t1); return o; };
  const nz = (t0, dur, type, f, g0, q = 1) => { const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.setValueAtTime(g0, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur); s.connect(fl).connect(g).connect(out); s.start(t0, Math.random() * (len - dur - .1)); s.stop(t0 + dur); };
  const drop = (t, f0, f1, dur, g0) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(g0, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(out); o.start(t); o.stop(t + dur); };
  if (name === 'Airhorn') {
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(out);
    [[0, .18], [.24, .42], [.5, 1.35]].forEach(([a, b]) => [415, 420, 523, 528].forEach((f) => osc('sawtooth', f, a, b, .09, lp)));
  } else if (name === 'Ba dum tss') {
    drop(0, 220, 90, .25, .8); drop(.28, 160, 70, .3, .8); nz(.58, 1, 'highpass', 6000, .5); drop(.58, 180, 60, .2, .5);
  } else if (name === 'Sad trombone') {
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(out);
    [[293.7, 0, .5], [277.2, .55, 1.05], [261.6, 1.1, 1.6]].forEach(([f, a, b]) => osc('sawtooth', f, a, b, .22, lp));
    const o = osc('sawtooth', 246.9, 1.65, 2.95, .22, lp), v = c.createOscillator(), vg = c.createGain(); v.frequency.value = 6; vg.gain.value = 6; v.connect(vg).connect(o.frequency); v.start(1.9);
  } else if (name === 'Boing') {
    const o = c.createOscillator(), g = c.createGain(), v = c.createOscillator(), vg = c.createGain();
    o.frequency.setValueAtTime(140, 0); o.frequency.exponentialRampToValueAtTime(420, .9); v.frequency.value = 22; vg.gain.setValueAtTime(90, 0); vg.gain.exponentialRampToValueAtTime(1, .9);
    v.connect(vg).connect(o.frequency); g.gain.setValueAtTime(.6, 0); g.gain.exponentialRampToValueAtTime(.001, 1); o.connect(g).connect(out); o.start(); v.start(); o.stop(1); v.stop(1);
  } else if (name === 'Laser') {
    const o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.setValueAtTime(2200, 0); o.frequency.exponentialRampToValueAtTime(120, .4);
    g.gain.setValueAtTime(.25, 0); g.gain.exponentialRampToValueAtTime(.001, .45); o.connect(g).connect(out); o.start(); o.stop(.5);
  } else if (name === 'Drumroll') {
    let t = 0; while (t < 2.1) { nz(t, .08, 'bandpass', 1800, .25 + t * .12); t += Math.max(.035, .09 - t * .03); }
    nz(2.1, .7, 'highpass', 4000, .7); drop(2.1, 120, 50, .4, .9);
  } else if (name === 'Coin') {
    osc('square', 987.8, 0, .08, .15); const o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = 1318.5; g.gain.setValueAtTime(.15, .08); g.gain.exponentialRampToValueAtTime(.001, .55); o.connect(g).connect(out); o.start(.08); o.stop(.6);
  } else if (name === 'Applause') {
    for (let i = 0; i < 260; i++) { const t = Math.random() * 3; nz(t, .03, 'bandpass', 900 + Math.random() * 1600, .12 * Math.sin(t / 3 * Math.PI) + .02, 1.5); }
  } else if (name === 'Explosion') {
    const s = c.createBufferSource(), lp = c.createBiquadFilter(), g = c.createGain(); s.buffer = noise; lp.type = 'lowpass'; lp.frequency.setValueAtTime(3000, 0); lp.frequency.exponentialRampToValueAtTime(60, 2.4);
    g.gain.setValueAtTime(1, 0); g.gain.exponentialRampToValueAtTime(.001, 2.5); s.connect(lp).connect(g).connect(out); s.start(); drop(0, 90, 30, 1.2, 1);
  } else if (name === 'Crickets') {
    for (let k = 0; k < 6; k++) for (let i = 0; i < 4; i++) { const t = k * .4 + i * .05 + (k % 2) * .05; osc('sine', 4600, t, t + .035, .08); }
  }
  const buf = await c.startRendering(), d = buf.getChannelData(0);
  let peak = 0; for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  if (peak) for (let i = 0; i < d.length; i++) d[i] *= .85 / peak; // even out loudness across sounds
  return buf;
}

async function getBuffer(i) {
  if (buffers[i]) return buffers[i];
  const p = pads[i];
  if (p.kind === 'builtin') buffers[i] = await synth(p.builtin);
  else if (p.kind === 'clip') { const blob = await db.get('pad' + i); if (!blob) return null; buffers[i] = await ac.decodeAudioData(await blob.arrayBuffer()); }
  return buffers[i] || null;
}

// ---------- playback ----------
async function fire(i) {
  ensureAudio();
  const p = pads[i];
  if (editing) { select(i); return; }
  if (!p.kind) { select(i); setEditing(true); return; }
  if (playingSrc[i] && playingSrc[i].length && (p.loop || !cfg.overlap)) { stop(i); if (p.loop) return; }
  if (!cfg.overlap) Object.keys(playingSrc).forEach(stop);
  const buf = await getBuffer(i); if (!buf) return SQ.toast('This pad is empty');
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = buf; src.loop = p.loop; g.gain.value = p.vol / 100;
  src.connect(g).connect(masterGain); src.start();
  const item = { src, start: ac.currentTime, dur: buf.duration };
  (playingSrc[i] = playingSrc[i] || []).push(item);
  src.onended = () => { playingSrc[i] = (playingSrc[i] || []).filter((x) => x !== item); };
}
function stop(i) { (playingSrc[i] || []).forEach((x) => { try { x.src.stop(); } catch {} }); playingSrc[i] = []; }
$('#stopAll').onclick = () => Object.keys(playingSrc).forEach(stop);

function renderPads() {
  const box = $('#pads'); box.innerHTML = '';
  pads.forEach((p, i) => {
    const b = el('button', { class: 'pad' + (p.kind ? '' : ' empty') + (editing && i === sel ? ' sel' : ''), style: { '--c': p.color }, 'data-i': i, onclick: () => fire(i) },
      el('b', {}, p.kind ? p.name || 'Untitled' : '+ Add sound'),
      el('div', { class: 'meta' }, el('kbd', {}, KEYS[i].toUpperCase()), p.loop ? el('span', {}, 'loop') : null),
      el('div', { class: 'prog' }));
    b.addEventListener('dragover', (e) => e.preventDefault());
    b.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) setClip(i, f, f.name.replace(/\.[^.]+$/, '')); });
    box.append(b);
  });
}
function animate() {
  requestAnimationFrame(animate);
  if (!ac) return;
  SQ.$$('.pad').forEach((n) => {
    const list = playingSrc[n.dataset.i] || [], last = list[list.length - 1];
    n.classList.toggle('playing', !!last);
    const prog = n.querySelector('.prog');
    prog.style.width = last ? `${((ac.currentTime - last.start) % last.dur) / last.dur * 100}%` : '0';
  });
}
requestAnimationFrame(animate);
addEventListener('keydown', (e) => {
  if (SQ.isTyping(e) || e.repeat || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') return $('#stopAll').click();
  const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) fire(i);
});

// ---------- editing ----------
function setEditing(on) { editing = on; $('#edit').textContent = on ? 'Done editing' : 'Edit pads'; $('#edit').classList.toggle('on', on); $('#editor').hidden = !on; renderPads(); if (on) select(sel); }
$('#edit').onclick = () => setEditing(!editing);
function select(i) {
  sel = i; const p = pads[i];
  $('#padNo').textContent = `${i + 1} (${KEYS[i].toUpperCase()})`; $('#name').value = p.name; $('#vol').value = p.vol; $('#volL').textContent = p.vol + '%'; $('#loop').checked = p.loop;
  $('#colors').innerHTML = ''; COLORS.forEach((c) => $('#colors').append(el('button', { style: { background: c, outline: c === p.color ? '2px solid var(--ink)' : '' }, onclick: () => { p.color = c; savePads(); renderPads(); select(i); } })));
  renderPads();
}
$('#name').oninput = (e) => { pads[sel].name = e.target.value; savePads(); renderPads(); };
$('#vol').oninput = (e) => { pads[sel].vol = +e.target.value; $('#volL').textContent = e.target.value + '%'; savePads(); };
$('#loop').onchange = (e) => { pads[sel].loop = e.target.checked; savePads(); renderPads(); };
$('#load').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = (e) => { const f = e.target.files[0]; if (f) setClip(sel, f, f.name.replace(/\.[^.]+$/, '')); e.target.value = ''; };
async function setClip(i, blob, name) {
  ensureAudio();
  try { buffers[i] = await ac.decodeAudioData(await blob.arrayBuffer()); } catch { return SQ.toast('Could not decode that audio'); }
  await db.set('pad' + i, blob);
  Object.assign(pads[i], { kind: 'clip', name: name || pads[i].name || 'Clip', builtin: undefined });
  savePads(); renderPads(); if (editing) select(i); SQ.toast('Loaded onto pad ' + KEYS[i].toUpperCase());
}
$('#clearPad').onclick = async () => { stop(sel); delete buffers[sel]; await db.del('pad' + sel); pads[sel] = { name: '', color: pads[sel].color, vol: 100, loop: false, kind: null }; savePads(); select(sel); };
$('#saveClip').onclick = async () => {
  ensureAudio(); const p = pads[sel];
  if (p.kind === 'clip') { const b = await db.get('pad' + sel); if (b) return SQ.download(b, `${p.name || 'clip'}.${(b.type.split('/')[1] || 'webm').split(';')[0]}`); }
  const buf = await getBuffer(sel); if (buf) SQ.download(SQ.encodeWAV(buf), `${p.name || 'clip'}.wav`);
};
let mediaRec = null;
$('#recBtn').onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true }), chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = (e) => chunks.push(e.data);
    mediaRec.onstop = () => { stream.getTracks().forEach((t) => t.stop()); $('#recBtn').innerHTML = '<span class="rec">● Record mic</span>'; setClip(sel, new Blob(chunks, { type: mediaRec.mimeType }), pads[sel].name || 'Recording ' + (sel + 1)); };
    mediaRec.start(); $('#recBtn').innerHTML = '<span class="rec"><span class="rec-dot"></span>Stop recording</span>';
  } catch { SQ.toast('Microphone blocked'); }
};

$('#master').value = cfg.master; $('#masterL').textContent = cfg.master + '%';
$('#master').oninput = (e) => { cfg.master = +e.target.value; $('#masterL').textContent = cfg.master + '%'; if (masterGain) masterGain.gain.value = cfg.master / 100; SQ.store.set('boop', cfg); };
$('#overlap').checked = cfg.overlap; $('#overlap').onchange = (e) => { cfg.overlap = e.target.checked; SQ.store.set('boop', cfg); };
renderPads();
</script>
</body>
</html>
